[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-recognition"
version = "1.0.0"
description = "A live handwritten digit recognizer and CNN visualizer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025.1.31",
    "numpy>=1.26,<3",
    "Pillow>=11,<13",
    "PySide6>=6.8,<7",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
digit-recognition = "digit_recognition.app:main"
digit-train = "digit_recognition.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
